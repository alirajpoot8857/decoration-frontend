<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Luxury Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#C69214" />
      <stop offset="85%" stop-color="#E8C86A" />
      <stop offset="100%" stop-color="#9A6F09" />
    </linearGradient>

    <linearGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B4E02" />
    </linearGradient>

    <!-- Dark Velvet Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#241B10" />
      <stop offset="60%" stop-color="#0E0B08" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>

    <!-- Golden Aura Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Luxury Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer Elegant Gold Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldLinear)" stroke-width="6" stroke-opacity="0.85" />
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="url(#goldLinear)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.5" />

  <!-- 4 Corner Luxury Filigree Accents -->
  <g fill="url(#goldLinear)">
    <!-- Top Left -->
    <circle cx="70" cy="70" r="5" />
    <path d="M 60 70 Q 70 70 70 60 Q 70 70 80 70 Q 70 70 70 80 Z" />
    <!-- Top Right -->
    <circle cx="442" cy="70" r="5" />
    <path d="M 432 70 Q 442 70 442 60 Q 442 70 452 70 Q 442 70 442 80 Z" />
    <!-- Bottom Left -->
    <circle cx="70" cy="442" r="5" />
    <path d="M 60 442 Q 70 442 70 432 Q 70 442 80 442 Q 70 442 70 452 Z" />
    <!-- Bottom Right -->
    <circle cx="442" cy="442" r="5" />
    <path d="M 432 442 Q 442 442 442 432 Q 442 442 452 442 Q 442 442 442 452 Z" />
  </g>

  <!-- Central Botanical Chandelier & Blooming Lotus Mandala -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Rotating Radiance Rings -->
    <circle r="140" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 8" />
    <circle r="120" fill="none" stroke="url(#goldLinear)" stroke-width="2" stroke-opacity="0.6" />

    <!-- 8 Petal Grand Botanical Stage Flower -->
    <!-- Top Petal -->
    <path d="M 0 0 C -25 -50 -35 -90 0 -130 C 35 -90 25 -50 0 0 Z" fill="url(#goldLinear)" opacity="0.9" />
    <!-- Bottom Petal -->
    <path d="M 0 0 C -25 50 -35 90 0 130 C 35 90 25 50 0 0 Z" fill="url(#goldLinear)" opacity="0.9" />
    <!-- Left Petal -->
    <path d="M 0 0 C -50 -25 -90 -35 -130 0 C -90 35 -50 25 0 0 Z" fill="url(#goldLinear)" opacity="0.9" />
    <!-- Right Petal -->
    <path d="M 0 0 C 50 -25 90 -35 130 0 C 90 35 50 25 0 0 Z" fill="url(#goldLinear)" opacity="0.9" />

    <!-- Diagonal Petals -->
    <g transform="rotate(45)">
      <path d="M 0 0 C -20 -40 -28 -75 0 -105 C 28 -75 20 -40 0 0 Z" fill="url(#goldLinear)" opacity="0.75" />
      <path d="M 0 0 C -20 40 -28 75 0 105 C 28 75 20 40 0 0 Z" fill="url(#goldLinear)" opacity="0.75" />
      <path d="M 0 0 C -40 -20 -75 -28 -105 0 C -75 28 -40 20 0 0 Z" fill="url(#goldLinear)" opacity="0.75" />
      <path d="M 0 0 C 40 -20 75 -28 105 0 C 75 28 40 20 0 0 Z" fill="url(#goldLinear)" opacity="0.75" />
    </g>

    <!-- Inner Chandelier Crystal Drop Ring -->
    <circle r="46" fill="url(#goldRadial)" stroke="#FFF3C4" stroke-width="3" />

    <!-- Central Diamond Starburst (✦) -->
    <path d="M 0 -28 Q 0 0 -28 0 Q 0 0 0 28 Q 0 0 28 0 Q 0 0 0 -28 Z" fill="#0B0A09" />
    <circle cx="0" cy="0" r="5" fill="#FFF3C4" />
  </g>
</svg>
