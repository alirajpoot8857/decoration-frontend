<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Imperial Gold Gradient -->
    <linearGradient id="adminGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="25%" stop-color="#F2D06B" />
      <stop offset="55%" stop-color="#C69214" />
      <stop offset="85%" stop-color="#E8C86A" />
      <stop offset="100%" stop-color="#7D5805" />
    </linearGradient>

    <radialGradient id="adminBgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2D1F0E" />
      <stop offset="55%" stop-color="#140E07" />
      <stop offset="100%" stop-color="#070503" />
    </radialGradient>

    <!-- Glowing Filter -->
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#adminBgGlow)" />

  <!-- Outer Executive Crest Borders -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#adminGoldLinear)" stroke-width="6" stroke-opacity="0.9" />
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="url(#adminGoldLinear)" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.6" />

  <!-- Imperial Executive Crown & Atelier Crest -->
  <g transform="translate(256, 260)" filter="url(#adminGlow)">
    <!-- Aura Ring -->
    <circle r="150" fill="none" stroke="url(#adminGoldLinear)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 8" />

    <!-- Radiant Back Glow Rays -->
    <g stroke="url(#adminGoldLinear)" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-140" x2="0" y2="-170" />
      <line x1="-70" y1="-120" x2="-90" y2="-150" />
      <line x1="70" y1="-120" x2="90" y2="-150" />
      <line x1="-120" y1="-70" x2="-150" y2="-90" />
      <line x1="120" y1="-70" x2="150" y2="-90" />
    </g>

    <!-- Imperial Crown Body -->
    <path
      d="M -130 60 
         L -150 -40 
         L -80 0 
         L 0 -110 
         L 80 0 
         L 150 -40 
         L 130 60 
         Z"
      fill="url(#adminGoldLinear)"
      stroke="#FFF8DC"
      stroke-width="3"
    />

    <!-- Crown Diadem Base Band -->
    <rect x="-136" y="60" width="272" height="34" rx="8" fill="url(#adminGoldLinear)" stroke="#FFF8DC" stroke-width="2" />

    <!-- Diadem Gemstones -->
    <circle cx="-90" cy="77" r="7" fill="#0A0908" stroke="#FFF8DC" stroke-width="2" />
    <circle cx="-45" cy="77" r="7" fill="#0A0908" stroke="#FFF8DC" stroke-width="2" />
    <circle cx="0" cy="77" r="9" fill="#0A0908" stroke="#FFF8DC" stroke-width="2.5" />
    <circle cx="45" cy="77" r="7" fill="#0A0908" stroke="#FFF8DC" stroke-width="2" />
    <circle cx="90" cy="77" r="7" fill="#0A0908" stroke="#FFF8DC" stroke-width="2" />

    <!-- 5 Crown Tip Starbursts / Jewels -->
    <!-- Left Tip -->
    <circle cx="-150" cy="-40" r="8" fill="#FFF8DC" stroke="#7D5805" stroke-width="2" />
    <!-- Mid-Left Tip -->
    <circle cx="-80" cy="0" r="7" fill="#FFF8DC" stroke="#7D5805" stroke-width="2" />
    <!-- Center Grand Jewel -->
    <g transform="translate(0, -110)">
      <circle cx="0" cy="0" r="14" fill="#FFF8DC" stroke="#7D5805" stroke-width="2.5" />
      <!-- Starburst inside -->
      <path d="M 0 -8 Q 0 0 -8 0 Q 0 0 0 8 Q 0 0 8 0 Q 0 0 0 -8 Z" fill="#0A0908" />
    </g>
    <!-- Mid-Right Tip -->
    <circle cx="80" cy="0" r="7" fill="#FFF8DC" stroke="#7D5805" stroke-width="2" />
    <!-- Right Tip -->
    <circle cx="150" cy="-40" r="8" fill="#FFF8DC" stroke="#7D5805" stroke-width="2" />

    <!-- Center Fleur-de-lis / Atelier Diamond Monogram in Crown -->
    <g transform="translate(0, 5)">
      <path d="M 0 -35 Q 0 0 -22 0 Q 0 0 0 25 Q 0 0 22 0 Q 0 0 0 -35 Z" fill="#0A0908" />
      <circle cx="0" cy="-5" r="4.5" fill="#FFF8DC" />
    </g>
  </g>
</svg>
